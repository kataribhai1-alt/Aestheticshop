
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AestheticShop Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial,sans-serif;padding:22px}
.wrap{max-width:600px;margin:auto}
h1{color:#e50914;letter-spacing:2px}
.card{background:#171717;padding:20px;border:1px solid #333;border-radius:12px;margin-top:20px}
input,select,button{width:100%;padding:14px;margin:8px 0;background:#252525;color:white;border:1px solid #444;border-radius:7px;font-size:15px}
button{background:#d10b17;border:0;font-weight:bold}
#status{color:#aaa;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="wrap">
<h1>AESTHETICSHOP</h1>
<p>ADMIN PANEL</p>

<div class="card" id="loginBox">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Admin email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
</div>

<div class="card" id="productBox" hidden>
<h2>Add New Product</h2>
<input id="name" placeholder="Product name">
<input id="price" type="number" placeholder="Price">
<select id="category">
<option value="T-Shirts">T-Shirts</option>
<option value="Hoodies">Hoodies</option>
<option value="Pants">Pants</option>
<option value="Shoes">Shoes</option>
<option value="Accessories">Accessories</option>
</select>
<input id="photo" type="file" accept="image/*">
<button onclick="addProduct()">UPLOAD PRODUCT</button>
<button onclick="logout()">LOGOUT</button>
<p id="status"></p>
</div>
</div>

<script>
const SUPABASE_URL="https://djvtgmolgvtnjkvthccs.supabase.co";
const SUPABASE_KEY="PASTE_YOUR_PUBLISHABLE_KEY_HERE";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function login(){
 const {data,error}=await db.auth.signInWithPassword({
  email:document.getElementById("email").value.trim(),
  password:document.getElementById("password").value
 });
 if(error){alert(error.message);return}
 document.getElementById("loginBox").hidden=true;
 document.getElementById("productBox").hidden=false;
}
async function logout(){
 await db.auth.signOut();
 location.reload();
}
async function addProduct(){
 const status=document.getElementById("status");
 const name=document.getElementById("name").value.trim();
 const price=Number(document.getElementById("price").value);
 const category=document.getElementById("category").value;
 const file=document.getElementById("photo").files[0];
 if(!name||!price||price<=0||!file){status.textContent="Name, valid price aur photo zaroori hain.";return}
 status.textContent="Uploading...";
 const path=crypto.randomUUID()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
 const {error:uploadError}=await db.storage.from("product-images").upload(path,file);
 if(uploadError){status.textContent=uploadError.message;return}
 const {data:urlData}=db.storage.from("product-images").getPublicUrl(path);
 const {error}=await db.from("products").insert({
  name,price,category,image_url:urlData.publicUrl
 });
 if(error){status.textContent=error.message;return}
 status.textContent="Product uploaded successfully!";
 document.getElementById("name").value="";
 document.getElementById("price").value="";
 document.getElementById("photo").value="";
}
db.auth.onAuthStateChange((event,session)=>{
 if(session){
  document.getElementById("loginBox").hidden=true;
  document.getElementById("productBox").hidden=false;
 }
});
</script>
</body>
</html>
